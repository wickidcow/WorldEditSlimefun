name: Java CI

on:
  push:
    branches:
      - main
      - dev
      - paper-26.2-fawe-recovery
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Verify JAR
        run: test -f target/SF_WorldEditSlimefun1.0.0.jar
