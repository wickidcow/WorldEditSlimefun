name: Build SFLWorldEdit

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sflworldedit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify compatibility metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<version>1.0.5</version>' pom.xml
          grep -Fq '<paper.version>1.21.11-R0.1-SNAPSHOT</paper.version>' pom.xml
          grep -Fq '<java.version>21</java.version>' pom.xml
          grep -Fq "api-version: '1.21.11'" src/main/resources/plugin.yml
      - name: Verify Paper/Purpur 1.21.11 compilation
        run: mvn --batch-mode clean package
      - name: Verify Paper/Purpur 26.2 compilation
        run: mvn --batch-mode -Dpaper.version=26.2.build.111-stable clean package
      - name: Build universal release JAR from 1.21.11 baseline
        run: mvn --batch-mode -Dpaper.version=1.21.11-R0.1-SNAPSHOT clean package
      - name: Resolve and verify build output
        id: project
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          JAR="target/SF_SFLWorldEdit_${VERSION}.jar"
          test -s "$JAR"
          unzip -p "$JAR" plugin.yml | grep -Fq "api-version: '1.21.11'"
          javap -verbose -classpath "$JAR" dev.j3fftw.worldeditslimefun.WorldEditSlimefun | grep -Fq 'major version: 65'
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "jar=${JAR}" >> "$GITHUB_OUTPUT"
          sha256sum "$JAR"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: SF_SFLWorldEdit_${{ steps.project.outputs.version }}.jar
          path: ${{ steps.project.outputs.jar }}
          archive: false
          if-no-files-found: error
      - name: Publish raw JAR to GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.project.outputs.version }}
          JAR: ${{ steps.project.outputs.jar }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${VERSION}"; fi
          TITLE="SFLWorldEdit ${VERSION}"
          NOTES="Compatibility release for Minecraft/Purpur 1.21.11 through Paper/Purpur 26.2. Keeps the existing schematic recovery improvements while emitting Java 21 bytecode and compile-checking both supported endpoints."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi
