name: Build SFLWorldEdit

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:
    inputs:
      publish_new_release:
        description: 'Explicitly publish a DISTINCT version only after coordinated validation'
        required: true
        type: boolean
        default: false
      expected_source_sha:
        description: 'Reviewed 40-character source SHA (must match the selected tag)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sflworldedit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify compatibility metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<version>1.0.6</version>' pom.xml
          grep -Fq '<paper.version>1.21.11-R0.1-SNAPSHOT</paper.version>' pom.xml
          grep -Fq '<worldedit.version>7.4.6-SNAPSHOT</worldedit.version>' pom.xml
          grep -Fq '<java.version>21</java.version>' pom.xml
          grep -Fq "api-version: '1.21.11'" src/main/resources/plugin.yml
      - name: Verify immutable publication guard
        shell: bash
        run: |
          bash -n scripts/publish_new_release.sh
          python3 -m unittest discover -s scripts -p 'test_publish_new_release.py' -v
      - name: Verify stable API probe and preserved release floor
        run: python3 -m unittest discover -s scripts -p 'test_stable_paper_compile.py' -v
      - name: Verify Maven Java 21 compiler and shaded package contract
        run: python3 -m unittest discover -s scripts -p 'test_maven_build_contract.py' -v
      - name: Verify Paper/Purpur 1.21.11 compilation
        run: mvn --batch-mode clean package
      - name: Verify Paper/Purpur 26.2 compilation
        run: mvn --batch-mode -Dpaper.version=26.2.build.111-stable clean package
      - name: Verify Paper/Purpur 26.3 stable compilation
        run: mvn --batch-mode -Dpaper.version=26.3.build.205-stable clean package
      - name: Build universal release JAR from 1.21.11 baseline
        run: mvn --batch-mode -Dpaper.version=1.21.11-R0.1-SNAPSHOT clean package
      - name: Verify real JUnit deprecation migrations and no test classes in raw JAR
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import subprocess
          from zipfile import ZipFile
          reports = list(Path('target/surefire-reports').glob('TEST-*.xml'))
          expected = {'WandListenerMessageTest': 1, 'MaterialRegistryFilterTest': 2, 'SelectionVolumeTest': 4}
          for name, minimum in expected.items():
              found = [p for p in reports if p.stem.endswith('.' + name)]
              if len(found) != 1:
                  raise SystemExit(f'Missing or duplicated test report: {name}')
              suite = ET.parse(found[0]).getroot()
              if int(suite.get('tests', '0')) < minimum or any(int(suite.get(k, '0')) for k in ('failures', 'errors', 'skipped')):
                  raise SystemExit(f'JUnit regression did not execute successfully: {name}')
          jar = Path('target/SF_SFWorldEdit1.0.6_(1.21.11-26.3).jar')
          with ZipFile(jar) as z:
              # The dependency filter must not remove the canonical project manifest,
              # plugin metadata or relocated command/metrics libraries from the raw JAR.
              names = z.namelist()
              if names.count('META-INF/MANIFEST.MF') != 1:
                  raise SystemExit('Canonical project manifest must occur exactly once')
              if b'Manifest-Version:' not in z.read('META-INF/MANIFEST.MF'):
                  raise SystemExit('Project manifest does not contain a standard version')
              if names.count('plugin.yml') != 1 or b'api-version:' not in z.read('plugin.yml'):
                  raise SystemExit('Shaded distribution lost its original plugin descriptor')
              if not any(n.startswith('dev/j3fftw/worldeditslimefun/acf/') and n.endswith('.class')
                         for n in names):
                  raise SystemExit('Shaded distribution lost relocated ACF command classes')
              if not any(n.startswith('dev/j3fftw/worldeditslimefun/bstats/') and n.endswith('.class')
                         for n in names):
                  raise SystemExit('Shaded distribution lost relocated bStats classes')
              print('Canonical manifest, plugin.yml, ACF and bStats packaging verified')
              if any(n.startswith(('org/junit/', 'org/opentest4j/', 'org/apiguardian/')) or '/test/' in n for n in z.namelist()):
                  raise SystemExit('Test-only classes leaked into the distribution')
              classes = [n for n in z.namelist() if n.endswith('.class')]
              if not classes:
                  raise SystemExit('Distribution has no Java classes')
              for name in classes:
                  header = z.read(name)[:8]
                  if len(header) != 8 or header[:4] != bytes.fromhex('cafebabe'):
                      raise SystemExit(f'Invalid class header: {name}')
                  major = int.from_bytes(header[6:8], 'big')
                  if major > 65:
                      raise SystemExit(f'Class exceeds Java 21 bytecode: {name}, major {major}')
              print(f'All {len(classes)} packaged classes target Java 21 or older')
          actual_api = subprocess.check_output(['javap', '-c', '-classpath', str(jar),
              'dev.j3fftw.worldeditslimefun.utils.Utils'], text=True)
          if 'org/bukkit/Material.isAir:()Z' not in actual_api or 'org/bukkit/Material.isEmpty:()Z' in actual_api:
              raise SystemExit('Compiled material registry must use supported isAir, not deprecated isEmpty')
          print('JUnit behavior cases and actual Material.isAir bytecode passed; test classes excluded')
          PY
      - name: Reject preview, corrupt and newer Java bytecode in complete shaded JAR
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_verify_java21_jar.py' -v
          python3 -O -m unittest discover -s scripts -p 'test_verify_java21_jar.py' -v
          python3 scripts/verify_java21_jar.py 'target/SF_SFWorldEdit1.0.6_(1.21.11-26.3).jar'
      - name: Verify repeatable exact-source raw JAR SHA-256
        shell: bash
        run: |
          set -euo pipefail
          JAR='target/SF_SFWorldEdit1.0.6_(1.21.11-26.3).jar'
          test -s "$JAR"
          FIRST="$(sha256sum "$JAR" | cut -d ' ' -f 1)"
          # The second clean build must cross the ZIP timestamp granularity boundary.
          sleep 2
          mvn --batch-mode -Dpaper.version=1.21.11-R0.1-SNAPSHOT clean package
          test -s "$JAR"
          SECOND="$(sha256sum "$JAR" | cut -d ' ' -f 1)"
          printf 'First raw JAR: %s\nSecond raw JAR: %s\n' "$FIRST" "$SECOND"
          if [[ "$FIRST" != "$SECOND" ]]; then
            echo "::error::Raw JAR is not byte-reproducible across separate clean builds"
            exit 1
          fi
      - name: Retain exact-head JUnit regression results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worldedit-selection-junit-evidence
          path: target/surefire-reports/TEST-*.xml
          if-no-files-found: error
      - name: Resolve and verify build output
        id: project
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          JAR="target/SF_SFWorldEdit${VERSION}_(1.21.11-26.3).jar"
          test -s "$JAR"
          unzip -p "$JAR" plugin.yml | grep -Fq "api-version: '1.21.11'"
          javap -verbose -classpath "$JAR" dev.j3fftw.worldeditslimefun.WorldEditSlimefun | grep -Fq 'major version: 65'
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "jar=${JAR}" >> "$GITHUB_OUTPUT"
          sha256sum "$JAR"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: SF_SFWorldEdit${{ steps.project.outputs.version }}_(1.21.11-26.3).jar
          path: ${{ steps.project.outputs.jar }}
          archive: false
          if-no-files-found: error
      # Tag pushes and normal branch builds are BUILD-ONLY; never edit a past release.
      # Dispatch this workflow on an already-reviewed tag and supply that tag's
      # exact source SHA only when the coordinated release gates have passed.
      - name: Publish a distinct immutable release after explicit authorization
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') && inputs.publish_new_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.project.outputs.version }}
          JAR: ${{ steps.project.outputs.jar }}
          RELEASE_CONFIRMED: ${{ inputs.publish_new_release }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          RELEASE_JAR="target/SF_SFWorldEdit${VERSION}_1.21.11-26.3.jar"
          cp "$JAR" "$RELEASE_JAR"
          JAR="$RELEASE_JAR" bash scripts/publish_new_release.sh
